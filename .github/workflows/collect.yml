name: 치지직 데이터 수집

on:
  schedule:
    # 10분마다 실행 (스케줄러 재등록용 터치: 2026-10-07)
    - cron: '*/10 * * * *'
  workflow_dispatch:  # 수동 실행 가능

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 스냅샷 수집
        run: |
          # 이전 latest.json 백업 (라이징 비교용)
          cp data/latest.json /tmp/prev_latest.json
          python3 collector/collector.py

      - name: 라이징 계산 및 히스토리 집계
        run: |
          python3 collector/rising.py /tmp/prev_latest.json data/latest.json -o data/rising.json
          # 채널별 히스토리 증분 집계 (내 방송 통계용)
          python3 collector/build_history.py

      - name: 변경사항 커밋 (data 브랜치)
        run: |
          git config user.name "chzzk-rising-bot"
          git config user.email "bot@example.com"
          # 스냅샷 원본은 커밋하지 않음 (.gitignore)
          git add data/latest.json data/rising.json data/channel_history.json
          git diff --staged --quiet && echo "변경 없음" && exit 0
          git commit -m "데이터 업데이트 $(date +'%Y-%m-%d %H:%M')"
          # data 브랜치에만 푸시 → main 변경 없으므로 Vercel 재배포 없음
          # --force: main에 코드 푸시되면 data 브랜치와 분기되므로 매번 강제 동기화
          git push --force origin HEAD:refs/heads/data

      - name: jsDelivr 캐시 퍼지
        run: |
          for f in rising.json latest.json channel_history.json; do
            curl -s "https://purge.jsdelivr.net/gh/ParkBeomMin/chzzk-rising@data/data/$f" > /dev/null
          done
          echo "jsDelivr purge done"
