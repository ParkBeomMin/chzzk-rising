<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>라이징 뱃지</title>
<style>
  * { margin:0; padding:0; }
  html, body { background:transparent; height:100%; display:flex; align-items:center; justify-content:center; font-family:'Pretendard',sans-serif; }
  #badge { display:none; align-items:center; gap:10px; background:rgba(0,0,0,0.65); border:2px solid #00ffa3; border-radius:16px; padding:10px 20px; color:#fff; }
  #badge.show { display:flex; }
  #rank { font-size:44px; font-weight:800; color:#00ffa3; }
  #txt { font-size:20px; line-height:1.3; }
  #txt small { color:#00ffa3; }
</style>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-EGCHE17WX6"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-EGCHE17WX6');
</script>
</head>
<body>
<div id="badge">
  <div id="rank"></div>
  <div id="txt">치지직 나침반<br><small>라이징 스트리머</small></div>
</div>
<script>
// URL 파라미터: ?channel=채널ID
// 라이징 순위에 있으면 뱃지 표시, 없으면 숨김
const q = new URLSearchParams(location.search);
const cid = q.get('channel');
if (cid) {
  fetch('https://raw.githubusercontent.com/ParkBeomMin/chzzk-rising/data/data/rising.json').then(r => r.json()).then(d => {
    const i = d.ranking.findIndex(x => x.channelId === cid);
    if (i >= 0 && i < 100) {
      document.getElementById('rank').textContent = (i+1) + '위';
      document.getElementById('badge').classList.add('show');
    }
  }).catch(()=>{});
}
// 사용 횟수 기록
fetch('https://abacus.jasoncameron.dev/hit/chzzk-compass/badge').catch(()=>{});
</script>
</body>
</html>
