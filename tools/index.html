<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>스트리머 도구 - 치지직 나침반</title>
<link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
<style>
  :root { --bg:#0f0f13; --card:#1a1a22; --accent:#00ffa3; --text:#f0f0f0; --muted:#888; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,'Pretendard','Noto Sans KR',sans-serif; }
  .ic { width:1.15em; height:1.15em; vertical-align:-0.2em; }
  header { padding:20px 16px 12px; text-align:center; border-bottom:1px solid #222; }
  header h1 { font-size:20px; display:flex; align-items:center; justify-content:center; gap:8px; }
  header h1 span { color:var(--accent); }
  header p { color:var(--muted); font-size:13px; margin-top:6px; }
  nav { display:flex; justify-content:center; gap:8px; padding:12px; }
  nav a { color:var(--muted); text-decoration:none; font-size:14px; padding:8px 16px; border-radius:20px; background:var(--card); display:flex; align-items:center; gap:6px; }
  nav a.active { color:#000; background:var(--accent); font-weight:bold; }
  #wrap { max-width:720px; margin:0 auto; padding:16px; }
  .tool { background:var(--card); border-radius:12px; padding:16px; margin-bottom:12px; }
  .tool-head { display:flex; align-items:center; gap:10px; margin-bottom:6px; }
  .tool-head .tic { width:40px; height:40px; border-radius:10px; background:#00331f; display:flex; align-items:center; justify-content:center; color:var(--accent); flex-shrink:0; }
  .tool-head .tic svg { width:22px; height:22px; }
  .tool h2 { font-size:16px; }
  .tool .use-cnt { margin-left:auto; font-size:12px; color:var(--muted); white-space:nowrap; }
  .tool p { font-size:13px; color:var(--muted); line-height:1.6; }
  .tool .params { font-size:12px; color:var(--muted); background:#111; border-radius:8px; padding:8px 10px; margin-top:8px; font-family:monospace; word-break:break-all; }
  .btn-row { display:flex; gap:8px; margin-top:10px; }
  .btn { flex:1; text-align:center; padding:10px; border-radius:10px; font-size:14px; font-weight:600; text-decoration:none; cursor:pointer; border:none; }
  .btn.go { background:var(--accent); color:#000; }
  .btn.copy { background:#222; color:var(--text); }
  .howto { background:#141419; border-radius:12px; padding:16px; margin-bottom:16px; font-size:13px; line-height:1.8; color:var(--muted); }
  .howto b { color:var(--text); }
  .howto ol { margin-left:18px; }
  footer { text-align:center; color:var(--muted); font-size:12px; padding:24px; }
</style>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7426857657290789" crossorigin="anonymous"></script>
</head>
<body>
<header>
  <h1><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg> 스트리머 <span>도구</span></h1>
  <p>방송에 바로 쓰는 무료 도구 모음</p>
</header>
<nav>
  <a href="../index.html"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88" fill="currentColor" stroke="none"/></svg> 나침반</a>
  <a href="../stats.html"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg> 내 방송 통계</a>
  <a href="./" class="active"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg> 도구</a>
</nav>
<div id="wrap">
  <div class="howto">
    <b>OBS에 오버레이 넣는 법</b>
    <ol>
      <li>OBS에서 소스 <b>+</b> → <b>브라우저</b> 선택</li>
      <li>아래 도구에서 <b>URL 복사</b> → OBS의 URL 칸에 붙여넣기</li>
      <li>너비/높이 조절 후 확인 (예: 시계는 400×150)</li>
    </ol>
  </div>
  <div id="tools"></div>
</div>
<div style="max-width:720px;margin:0 auto;padding:0 16px;"><div style="background:var(--card);border-radius:12px;overflow:hidden;"><ins class="adsbygoogle"
     style="display:block"
     data-ad-client="ca-pub-7426857657290789"
     data-ad-slot="7184012483"
     data-ad-format="auto"
     data-full-width-responsive="true"></ins></div></div>
<footer>© 치지직 나침반</footer>
<script>
const BASE = 'https://chzzk.duckmu.com/tools/';
const TOOLS = [
  { key:'raffle', name:'추첨기', desc:'시청자 이벤트용 랜덤 추첨. 참가자 입력 후 버튼 하나로 당첨자 선정. OBS 오버레이 모드 지원 (?overlay=1).',
    icon:'<polyline points="20 12 20 22 4 22 4 12"/><rect x="2" y="7" width="20" height="5"/><line x1="12" y1="22" x2="12" y2="7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/>',
    page:'raffle.html', obs:false, params:'?overlay=1 (OBS 오버레이 모드)' },
  { key:'clock', name:'시계 오버레이', desc:'투명 배경 실시간 시계. OBS 브라우저 소스로 추가.',
    icon:'<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
    page:'clock.html', obs:true, params:'?size=80 &color=#ffffff (크기·색상 조절)' },
  { key:'countdown', name:'카운트다운 오버레이', desc:'"방송 시작까지 10:00" 대기 화면용 타이머.',
    icon:'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2"/><path d="M9 2h6"/>',
    page:'countdown.html', obs:true, params:'?min=10 &msg=곧 시작합니다 (분·문구 설정)' },
  { key:'badge', name:'라이징 뱃지', desc:'나침반 라이징 100위 안에 들면 표시되는 뱃지.',
    icon:'<circle cx="12" cy="9" r="6"/><path d="M8.5 14L7 22l5-3 5 3-1.5-8"/>',
    page:'badge.html', obs:true, params:'?channel=채널ID (내 채널ID 입력)' },
];
const wrap = document.getElementById('tools');
wrap.innerHTML = TOOLS.map(t => `
  <div class="tool">
    <div class="tool-head">
      <div class="tic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${t.icon}</svg></div>
      <h2>${t.name}</h2>
      <span class="use-cnt" id="cnt-${t.key}">-</span>
    </div>
    <p>${t.desc}</p>
    <div class="params">${t.params}</div>
    <div class="btn-row">
      <a class="btn go" href="${t.page}">열기</a>
      <button class="btn copy" onclick="copyUrl('${t.page}')">URL 복사</button>
    </div>
  </div>`).join('');

function copyUrl(page) {
  navigator.clipboard.writeText(BASE + page).then(() => alert('URL이 복사됐어요!\nOBS 브라우저 소스에 붙여넣으세요.'));
}
// 사용 횟수 표시
TOOLS.forEach(t => {
  fetch(`https://abacus.jasoncameron.dev/get/chzzk-compass/${t.key}`)
    .then(r => r.json()).then(d => {
      document.getElementById('cnt-'+t.key).textContent =
        `사용 ${(d.value||0).toLocaleString()}회`;
    }).catch(()=>{});
});
</script>
<script>
function adsPush(){ try { (adsbygoogle = window.adsbygoogle || []).push({}); } catch(e){} }
</script>
<script>adsPush();</script>
</body>
</html>
