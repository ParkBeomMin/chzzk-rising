<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>치지직 나침반 - 지금 뜨는 방송 찾기</title>
<meta name="description" content="치지직에서 지금 급상승 중인 스트리머를 찾아보세요. 시청자 수 급등 랭킹, 카테고리별 실시간 방송 목록.">
<style>
  :root { --bg:#0f0f13; --card:#1a1a22; --accent:#00ffa3; --text:#f0f0f0; --muted:#888; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,'Pretendard','Noto Sans KR',sans-serif; }
  header { padding:20px 16px 12px; text-align:center; border-bottom:1px solid #222; }
  header h1 { font-size:22px; }
  header h1 span { color:var(--accent); }
  header p { color:var(--muted); font-size:13px; margin-top:6px; }
  .updated { text-align:center; color:var(--muted); font-size:12px; padding:8px; }
  .tabs { display:flex; justify-content:center; gap:8px; padding:12px; position:sticky; top:0; background:var(--bg); z-index:10; }
  .tabs button { background:var(--card); color:var(--text); border:1px solid #333; border-radius:20px; padding:8px 18px; font-size:14px; cursor:pointer; }
  .tabs button.active { background:var(--accent); color:#000; border-color:var(--accent); font-weight:bold; }
  .filter { display:flex; gap:8px; overflow-x:auto; padding:4px 16px 12px; }
  .filter button { white-space:nowrap; background:#222; color:var(--muted); border:none; border-radius:16px; padding:6px 14px; font-size:13px; cursor:pointer; }
  .filter button.active { background:#333; color:var(--text); }
  #list { padding:0 16px 40px; max-width:720px; margin:0 auto; }
  .card { display:flex; gap:12px; background:var(--card); border-radius:12px; padding:12px; margin-bottom:10px; text-decoration:none; color:inherit; }
  .card img.thumb { width:120px; height:68px; object-fit:cover; border-radius:8px; background:#222; flex-shrink:0; }
  .card .info { flex:1; min-width:0; }
  .card .title { font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card .meta { font-size:12px; color:var(--muted); margin-top:4px; }
  .card .viewers { color:var(--accent); font-weight:bold; }
  .rank { font-size:20px; font-weight:800; color:var(--accent); min-width:32px; text-align:center; align-self:center; }
  .growth { display:inline-block; background:#00331f; color:var(--accent); font-size:12px; font-weight:bold; border-radius:6px; padding:2px 8px; margin-top:4px; }
  .ad-slot { background:#15151c; border:1px dashed #333; border-radius:12px; text-align:center; color:var(--muted); font-size:12px; padding:24px; margin:12px 0; }
  footer { text-align:center; color:var(--muted); font-size:12px; padding:24px; }
  .empty { text-align:center; color:var(--muted); padding:40px 0; }
</style>
</head>
<body>
<header>
  <h1>🧭 치지직 <span>나침반</span></h1>
  <p>지금 급상승 중인 방송을 찾아보세요</p>
</header>
<div class="updated" id="updatedAt">로딩 중...</div>
<div class="tabs">
  <button id="tabRising" class="active" onclick="showTab('rising')">🔥 라이징</button>
  <button id="tabLive" onclick="showTab('live')">📡 실시간 전체</button>
</div>
<div class="filter" id="catFilter"></div>
<div id="list"></div>
<footer>데이터: 치지직 공개 API · 매시간 갱신<br>© 치지직 나침반</footer>

<script>
let DATA = null, RISING = null, curTab = 'rising', curCat = '전체';

async function load() {
  try {
    const [d, r] = await Promise.all([
      fetch('data/latest.json').then(x => x.json()),
      fetch('data/rising.json').then(x => x.json()).catch(() => null)
    ]);
    DATA = d; RISING = r;
    document.getElementById('updatedAt').textContent =
      '업데이트: ' + new Date(d.collectedAt).toLocaleString('ko-KR');
    buildFilter(); render();
  } catch(e) {
    document.getElementById('list').innerHTML = '<div class="empty">데이터를 불러오지 못했습니다.</div>';
  }
}
function cats() {
  const s = new Set(['전체']);
  (DATA.lives||[]).forEach(l => s.add(l.category));
  return [...s].slice(0, 15);
}
function buildFilter() {
  document.getElementById('catFilter').innerHTML = cats().map(c =>
    `<button class="${c===curCat?'active':''}" onclick="setCat('${c}')">${c}</button>`).join('');
}
function setCat(c){ curCat=c; buildFilter(); render(); }
function showTab(t){
  curTab=t;
  document.getElementById('tabRising').classList.toggle('active', t==='rising');
  document.getElementById('tabLive').classList.toggle('active', t==='live');
  render();
}
function fmt(n){ return n>=10000 ? (n/10000).toFixed(1)+'만' : n.toLocaleString(); }
function card(l, i, growth){
  return `<a class="card" href="https://chzzk.naver.com/live/${l.channelId}" target="_blank" rel="noopener">
    ${i!=null?`<div class="rank">${i+1}</div>`:''}
    <img class="thumb" src="${l.thumbnail}" loading="lazy" onerror="this.style.display='none'">
    <div class="info">
      <div class="title">${esc(l.liveTitle)||'(제목 없음)'}</div>
      <div class="meta">${esc(l.channelName)} · ${esc(l.category)} · <span class="viewers">👁 ${fmt(l.viewers)}</span></div>
      ${growth?`<div><span class="growth">${growth}</span></div>`:''}
    </div></a>`;
}
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function render(){
  const el = document.getElementById('list');
  let items = [];
  if (curTab === 'rising' && RISING && RISING.ranking.length) {
    items = RISING.ranking.filter(l => curCat==='전체' || l.category===curCat);
    el.innerHTML = items.length
      ? items.slice(0,50).map((l,i)=>card(l,i,l.growthPct)).join('')
      : '<div class="empty">아직 라이징 데이터가 쌓이는 중입니다.<br>곧 업데이트됩니다.</div>';
  } else {
    items = (DATA.lives||[]).filter(l => curCat==='전체' || l.category===curCat);
    let html = '';
    items.slice(0,60).forEach((l,i)=>{
      html += card(l, curCat==='전체'?i:null);
      if ((i+1)%10===0) html += '<div class="ad-slot">광고 영역 (AdSense)</div>';
    });
    el.innerHTML = html || '<div class="empty">방송이 없습니다.</div>';
  }
}
load();
</script>
</body>
</html>
